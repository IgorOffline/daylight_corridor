[meta]
name = "bosonoga_multiplier"
version = "0.3.1"
skip_version_check = false

[gfx]
width = 1152
height = 648
# The most frames a second, 60 when left out.
fps_max = 144

[global]
# The field of view in whole degrees, from 1 to 179.
fov = 60_i32
# The height of the eye above the ground, which is at 0, and below the
# canopies, which start at 2.2.
eye_height = 1d7_f32
# Units a second.
walk_speed = 7d5_f32

[color]
# A pale city sky, paving, and the parts of a tree.
background = "9CC3E6"
paving = "9A968C"
grass = "557A34"
trunk = "5C4030"
leaves_dark = "2E6B34"
leaves = "3E8A3A"
leaves_light = "62A443"
leaves_outline = "1E4422"
# Concrete, brick and slate city blocks, with darker edges.
block = "A3A39C"
block_brick = "A06A52"
block_dark = "6C7480"
block_outline = "4A4E55"
# 1A212E at 82%, and 1A1A1A at 60%.
label_back = "1A212ED1"
label_text = "FFFFFF"
crosshair_shadow = "1A1A1A99"
crosshair = "FFFFFF"

[font]
label = "asset/font/IntelOneMono-Medium.ttf"

[key]
escape = "SAPP_KEYCODE_ESCAPE"
mouse = "SAPP_KEYCODE_M"
forward = "SAPP_KEYCODE_W"
back = "SAPP_KEYCODE_S"
left = "SAPP_KEYCODE_A"
right = "SAPP_KEYCODE_D"

[mouse]
sensitivity = 0d25_f32
invert_north = false_bool
invert_west = false_bool
